# Publishes site/ (the homepage) to GitHub Pages on every push to main that touches it.
name: Homepage

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Point the sign-in buttons at the hosted app, and the film library at its API
        env:
          APP_URL: ${{ vars.APP_URL }}
          API_URL: ${{ vars.API_URL }}
        run: |
          # Empty values ship a homepage whose sign-in and film library silently do nothing.
          if [ -z "$APP_URL" ] || [ -z "$API_URL" ]; then
            echo "::error::Repo variables APP_URL and API_URL must be set (run 'make host-pages' on the host)."
            exit 1
          fi
          printf 'window.CREATOR_AGENT = { appUrl: %s, apiUrl: %s };\n' \
            "$(jq -Rn --arg u "$APP_URL" '$u')" "$(jq -Rn --arg u "$API_URL" '$u')" > site/config.js
          cat site/config.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
