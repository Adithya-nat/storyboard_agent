# Host on your own computer behind Tailscale Funnel (no Caddy, no open router ports).
# Ports stay on loopback; Funnel publishes 443 -> web (3300) and 8443 -> api (8300). See DEPLOY.md.
#   docker compose -f deploy/compose.prod.yml -f deploy/compose.laptop.yml --env-file deploy/.env up -d --build api web
services:
  api:
    ports: ["127.0.0.1:8300:8000"]
    environment:
      AUTH_JWKS_URL: http://web:3000/api/auth/jwks   # fetch keys inside Docker, not back through the tunnel
      # Docker Desktop corrupts some large TLS uploads; send HTTPS out via deploy/egress_proxy.py on the Mac.
      HTTPS_PROXY: http://host.docker.internal:18443
      NO_PROXY: localhost,127.0.0.1,web,api
  web:
    ports: ["127.0.0.1:3300:3000"]
