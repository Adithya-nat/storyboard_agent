[project]
name = "creator-agent"
version = "0.2.0"
description = "Creator Agent: open-source AI studio that turns one line into a vertical short film"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "sse-starlette>=3.7",
    "pydantic>=2.14",
    "pydantic-settings>=2.14",
    "langgraph>=1.2.20,<2",
    "langgraph-checkpoint-postgres>=3.2",
    "psycopg[binary]>=3.1",                # driver for the postgres checkpointer
    "google-genai>=3.2,<4",  # Interactions API calls pin api_version="v1beta"
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "tenacity>=8.3",
    "python-multipart>=0.0.9",
    "pillow>=11",  # + system libraqm for Tamil caption shaping
    "slowapi>=0.1.9",        # per-IP rate limit on the public create endpoint
    "httpx>=0.27",           # Turnstile siteverify (also used by tests)
    "pyjwt[crypto]>=2.10",   # verifies sign-in tokens (Better Auth JWKS, EdDSA)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",  # coverage report (Workstream 1-5: comprehensive new-code coverage)
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "langgraph-checkpoint-sqlite>=2.0",  # resume checkpointer for sqlite (tests/local dev)
    "python-dotenv>=1.0",  # live tests + bake-offs read .env
    "anthropic>=1.0",  # script bake-off only
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: real paid API calls; run with `pytest -m live` (skipped by default)"]
addopts = "-m 'not live'"
